# The whole GovTok stack on one machine (§1.1.1): `docker compose up`, then open https://localhost.
# Settings come from a `.env` file next to this one (see README "Self-hosting"). Every value has
# a local default, so a fresh clone runs with none. On a real server, change every password
# (POSTGRES_PASSWORD, MINIO_ROOT_PASSWORD, S3_SECRET_KEY) before setting DOMAIN.
#
# The project name is fixed so every git worktree shares one local Postgres and MinIO
# (scripts/worktree-setup.sh gives each worktree its own database and bucket in them).
# So `docker compose down -v` from any worktree deletes every worktree's data, and `up` from a
# worktree replaces the app and worker built by another.
name: govtok

x-database-url: &database-url postgres://${POSTGRES_USER:-govtok}:${POSTGRES_PASSWORD:-govtok}@postgres:5432/${POSTGRES_DB:-govtok}

x-storage-env: &storage-env
  S3_ENDPOINT: http://minio:9000
  # Presigned URLs point at Caddy, which routes /<bucket>/* to MinIO (Caddyfile). Set it
  # yourself when phones reach the site some other way, e.g. https://localhost:8443 with HTTPS_PORT=8443.
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-https://${DOMAIN:-localhost}}
  S3_BUCKET: ${S3_BUCKET:-govtok}
  # The app's own MinIO user, limited to the bucket (minio-init creates it). Never the root user.
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-govtok-app}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-govtok-app-dev-secret}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-govtok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-govtok}
      POSTGRES_DB: ${POSTGRES_DB:-govtok}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Localhost only, for `npm run dev` and worktrees. Not a common port, to stay clear of
    # other Postgres installs.
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The MinIO project stopped publishing images in 2025. pgsty/minio is a maintained community
  # build of the same server (it includes `mc`). Pinned by digest, since it's a third-party image.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-govtok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-govtok-dev-secret}
    volumes:
      - minio-data:/data
    ports:
      - 127.0.0.1:${MINIO_PORT:-19000}:9000
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # On boot: creates the bucket, and the app's MinIO user with a policy that only reaches the
  # bucket (and worktree buckets named <bucket>-*, scripts/worktree-setup.sh). Then exits.
  # Safe to re-run: it updates the policy and the user's password.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-govtok}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-govtok-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-govtok}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-govtok-app}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-govtok-app-dev-secret}
    entrypoint:
      - sh
      - -ec
      - |
        mc alias set govtok http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "govtok/$$S3_BUCKET"
        b="arn:aws:s3:::$$S3_BUCKET"
        printf '%s' '{"Version":"2012-10-17","Statement":[
          {"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject"],"Resource":["'"$$b"'/*","'"$$b"'-*/*"]},
          {"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["'"$$b"'","'"$$b"'-*"]}]}' > /tmp/policy.json
        mc admin policy create govtok govtok-app /tmp/policy.json
        mc admin user add govtok "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc admin policy attach govtok govtok-app --user "$$S3_ACCESS_KEY"

  # Applies the drizzle/ migrations, then exits.
  migrate:
    build:
      context: .
      target: worker
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      target: app
      args:
        NEXT_PUBLIC_GOOGLE_MAPS_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_KEY:-}
        NEXT_PUBLIC_GOOGLE_MAP_ID: ${NEXT_PUBLIC_GOOGLE_MAP_ID:-}
    restart: unless-stopped
    environment:
      <<: *storage-env
      DATABASE_URL: *database-url
      ADMIN_PASSCODE: ${ADMIN_PASSCODE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *storage-env
      DATABASE_URL: *database-url
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GOOGLE_GEOCODING_KEY: ${GOOGLE_GEOCODING_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # HTTPS in front of everything: phones only allow the camera on HTTPS (§1.1.1).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS: ${TLS:-internal}
      S3_BUCKET: ${S3_BUCKET:-govtok}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - minio

volumes:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
